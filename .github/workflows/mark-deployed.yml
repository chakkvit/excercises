# Flips a release from "pre-release" (not deployed yet) to a full release
# (deployed) once someone has actually shipped it -- there's no CI auto
# deploy here, same as emr-demo: a human decides when it really went out,
# this just records that decision on the release itself.
#
# release.yml's "find the base tag to diff against" step reads GitHub's
# own "latest release" (the most recent non-prerelease) to decide what
# counts as already shipped, so running this is what makes the next
# release's PR list and changed-files diff start from this tag.
name: Mark release deployed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag that was actually deployed, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  mark-deployed:
    runs-on: ubuntu-latest
    steps:
      - name: Flip the release out of pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
          echo "==> $TAG marked deployed"
